#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true

[bootstrap.packages]
# Desktop-only packages live in config.default.toml (default env, not loaded in WSL).
# Windows Operator System Manager
"winget:Fastfetch-cli.Fastfetch" = "latest"
"winget:Clement.bottom" = "latest"
"winget:dundee.gdu" = "latest"
"winget:ChuyuTeam.DISM++" = "latest"
"winget:RevoUninstaller.RevoUninstallerPro" = "latest"
# Windows Environment/Infrastructure
"winget:BrechtSanders.WinLibs.POSIX.UCRT" = "latest"
"winget:FiloSottile.age" = "latest"
"winget:jj-vcs.jj" = "latest"
"winget:GitHub.cli" = "latest"
"winget:GLab.GLab" = "latest"
"winget:tree-sitter.tree-sitter-cli" = "latest"
"winget:ImageMagick.ImageMagick" = "latest"
"winget:Orange-OpenSource.Hurl" = "latest"
"winget:WiresharkFoundation.Wireshark" = "latest"
# Windows UX Enhance
"winget:Brave.Brave" = "latest"
"winget:ajeetdsouza.zoxide" = "latest"
"winget:sharkdp.fd" = "latest"
"winget:junegunn.fzf" = "latest"
"winget:BurntSushi.ripgrep.MSVC" = "latest"
"winget:JesseDuffield.lazygit" = "latest"
"winget:sxyazi.yazi" = "latest"
# Terminal & Shell on Windows
"winget:Nushell.Nushell" = "latest"
"winget:Starship.Starship" = "latest"
# XXX: Please install TUIOS from GitHub Release: https://github.com/Gaurav-Gosain/tuios/releases
# It hasn't been added to the Winget package registry yet. 
# Development on Windows
"winget:Neovim.Neovim" = "latest"
"winget:Anthropic.ClaudeCode" = "latest"
"winget:farion1231.CC-Switch" = "latest"
"winget:EarendilWorks.pi" = "latest"
"winget:sharkdp.hyperfine" = "latest"

# Archlinux Operator System Manager
"pacman:fastfetch" = "latest"
"pacman:bottom" = "latest"
"pacman:gdu" = "latest"
# Archlinux Environment/Infrastructure
"pacman:wl-clipboard" = "latest"
"pacman:unzip" = "latest"
"pacman:wget" = "latest"
"pacman:less" = "latest"
"pacman:fontconfig" = "latest"
"pacman:noto-fonts-cjk" = "latest"
"pacman:age" = "latest"
"pacman:jujutsu" = "latest"
"pacman:github-cli" = "latest"
"pacman:glab" = "latest"
"pacman:tree-sitter-cli" = "latest"
"pacman:imagemagick" = "latest"
"pacman:wireshark-cli" = "latest"
"pacman:hurl" = "latest"
# Archlinux UX Enhance
"aur:brave-bin" = "latest"
"pacman:zoxide" = "latest"
"pacman:fd" = "latest"
"pacman:fzf" = "latest"
"pacman:ripgrep" = "latest"
"pacman:lazygit" = "latest"
"pacman:yazi" = "latest"
# Terminal & Shell on Archlinux
"pacman:nushell" = "latest"
"pacman:starship" = "latest"
"aur:tuios-bin" = "latest"
# Development on Archlinux
"pacman:neovim" = "latest"
"aur:claude-code" = "latest"
"aur:cc-switch-bin" = "latest"
"aur:pi-coding-agent-bin" = "latest"
"pacman:hyperfine" = "latest"

[bootstrap.files]
"/etc/sysctl.d/50-unprivileged-ports.conf" = { os = "linux", content = "net.ipv4.ip_unprivileged_port_start = 80"  }

[tools]
# Global But Not Included by Package Manager
"github:SyrianTurk/SyrianSegoe" = { os = "windows", version = "latest" } # Replace Windows system (Latin) font
fnox = "latest"
"github:vercel-labs/agent-browser" = "latest"
"github:vercel-labs/agent-desktop" = "latest"
"github:gcla/termshark" = "latest"
# Environment/Infrastructure
node = { version = "latest", postinstall = "npm install -g degit" }
bun = "latest"
python = "latest"
java = "lts"
go = "latest"
zig = "latest"

[dotfiles]
"~/.bashrc" = { mode = "track" }
"~/.config/jj/config.toml" = { mode = "track" }
"~/.config/lazygit/config.yml" = { mode = "track", variants = [{ os = "linux" }] }
"~/.config/mise/config.default.toml" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/mise/dotfiles/clash-verge-rev" = { mode = "track", variants = [{ profile = "default" }] }
# Narrow entries rather than the whole dotfiles directory: the desktop-only
# sources are scoped to the "default" environment (the one that loads
# config.default.toml), so the "wsl" environment neither saves nor deletes
# them. A blanket directory entry would capture them in every environment and
# let a WSL bootstrap publish their absence as a deletion.
"~/.config/mise/dotfiles/nushell" = { mode = "track" }
"~/.config/mise/dotfiles/nvim" = { mode = "track" }
"~/.config/mise/dotfiles/rime" = { mode = "track", variants = [{ profile = "default" }] }
"~/.config/mise/dotfiles/rio" = { mode = "track", variants = [{ profile = "default" }] }
"~/.config/mise/dotfiles/tuios" = { mode = "track" }
"~/.config/mise/dotfiles/vscode" = { mode = "track", variants = [{ profile = "default" }] }
"~/.config/mise/dotfiles/zed" = { mode = "track", variants = [{ profile = "default" }] }
"~/.config/mise/mise.lock" = { mode = "track" }
"~/.config/mise/miserc.toml" = { mode = "track" }
"~/.config/mise/scripts" = { mode = "track" }
"~/.config/rpiv-web-tools/config.json" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.local/bin/ai" = { mode = "track", variants = [{ os = "unix" }] }
"~/.local/bin/ai.cmd" = { mode = "track", variants = [{ os = "windows" }] }
"~/.local/bin/ai.nu" = { mode = "track" }
"~/.local/bin/reset_cjk-font-fallback.cmd" = { mode = "track", variants = [{ os = "windows" }] }
"~/.local/bin/set_cjk-font-fallback.cmd" = { mode = "track", variants = [{ os = "windows" }] }
"~/.pi/agent/APPEND_SYSTEM.md" = { mode = "track" }
"~/.pi/agent/agents/oracle.md" = { mode = "track" }
"~/.pi/agent/agents/researcher.md" = { mode = "track" }
"~/.pi/agent/agents/reviewer.md" = { mode = "track" }
"~/.pi/agent/agents/scout.md" = { mode = "track" }
"~/.pi/agent/agents/worker.md" = { mode = "track" }
"~/.pi/agent/auth.json" = { mode = "track" }
"~/.pi/agent/extensions/pi-permission-system/config.json" = { mode = "track" }
"~/.pi/agent/models.json" = { mode = "track" }
"~/.pi/agent/settings.json" = { mode = "track" }
"~/.profile" = { mode = "track" }
"~/.wslconfig" = { mode = "track", variants = [{ os = "windows" }] }
"~/AppData/Local/lazygit/config.yml" = { mode = "track", variants = [{ os = "windows" }] }
"~/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1" = { mode = "track", variants = [
  { os = "windows" },
] }
"~/Library/Application Support/lazygit/config.yml" = { mode = "track", variants = [{ os = "macos" }] }

[dotfiles."dotfiles/nushell/aliases/"]
mode = "copy"
source = "dotfiles/nushell/aliases/"
variants = [
  { os = "macos", target = "~/Library/Application Support/nushell/aliases/" },
  { os = "linux", target = "~/.config/nushell/aliases/" },
  { os = "windows", target = "~/AppData/Roaming/nushell/aliases/" },
]

[dotfiles."dotfiles/nushell/env.nu"]
mode = "copy"
source = "dotfiles/nushell/env.nu"
variants = [
  { os = "macos", target = "~/Library/Application Support/nushell/env.nu" },
  { os = "linux", target = "~/.config/nushell/env.nu" },
  { os = "windows", target = "~/AppData/Roaming/nushell/env.nu" },
]

[dotfiles."dotfiles/nushell/config.nu"]
mode = "copy"
source = "dotfiles/nushell/config.nu"
variants = [
  { os = "macos", target = "~/Library/Application Support/nushell/config.nu" },
  { os = "linux", target = "~/.config/nushell/config.nu" },
  { os = "windows", target = "~/AppData/Roaming/nushell/config.nu" },
]

[dotfiles."dotfiles/nvim/"]
mode = "copy"
source = "dotfiles/nvim/"
variants = [
  { os = "unix", target = "~/.config/nvim/" },
  { os = "windows", target = "~/AppData/Local/nvim/" },
]

[dotfiles."dotfiles/tuios/config.toml"]
mode = "copy"
source = "dotfiles/tuios/config.toml"
variants = [
  { os = "unix", target = "~/.config/tuios/config.toml" },
  { os = "windows", target = "~/AppData/Local/tuios/config.toml" },
]

[bootstrap.hooks.final]
run = "tuios integration install claude pi"
