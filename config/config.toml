[tasks.bootstrap]
run = '''
#!/usr/bin/env bun

import { $ } from "bun"
import path from "node:path"
import os from "node:os"

const COMMANDS = [
  // Setting up Clash Verge Rev
  ['bun', path.resolve(os.homedir(), '.config/mise/scripts/clash-verge-rev/patch_config.yaml.ts')],
  ['bun', path.resolve(os.homedir(), '.config/mise/scripts/clash-verge-rev/patch_verge.yaml.ts')],

{% if os() == "windows" %}
  // Setting up Windows Terminal
  ['bun', path.resolve(os.homedir(), '.config/mise/scripts/windows-terminal/patch_settings.json.ts')],
  ['bun', path.resolve(os.homedir(), '.config/mise/scripts/windows-terminal-preview/patch_settings.json.ts')],

  // Setting up Windows
  ['cmd', '/c', path.resolve(os.homedir(), '.config/mise/scripts/disable_ctrl_space.cmd')],
  ['cmd', '/c', path.resolve(os.homedir(), '.config/mise/scripts/set_cc_cxx.cmd')],
  ['cmd', '/c', path.resolve(os.homedir(), '.config/mise/scripts/set_yazi_file_one.cmd')],
  ['cmd', '/c', path.resolve(os.homedir(), '.local/bin/set_cjk-font-fallback.cmd')],

  // Setting up Worktrunk for Nushell
  ['git-wt', 'config', 'shell', 'install', 'nu', '--yes'],
{% else %}
  ['wt', 'config', 'shell', 'install', 'nu', '--yes'],
{% endif %}
]

for (const CMD of COMMANDS) {
  await $`${CMD}`
}
'''
