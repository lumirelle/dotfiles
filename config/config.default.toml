[tasks.bootstrap]
run = '''
#!/usr/bin/env nu

def run-script [script: path] {
  print $'==> ($script)'
  let ok = (try {
    ^nu $script
    true
  } catch {
    false
  })
  if not $ok {
    let code = ($env.LAST_EXIT_CODE? | default 1)
    print -e $'bootstrap: ($script) failed with exit code ($code)'
    exit $code
  }
}

def main [] {
  let scripts_dir = ($nu.home-dir | path join '.config' 'mise' 'scripts')

  # Run on every platform.
  let shared = [
    # Builds the PyYAML wheel mason needs when no prebuilt wheel exists for the
    # active Python; warns and skips when one is already built or published.
    ($nu.home-dir | path join '.local' 'bin' 'build-pyyaml.nu')
    ($scripts_dir | path join 'clash-verge-rev' 'patch-config.yaml.nu')
    ($scripts_dir | path join 'clash-verge-rev' 'patch-verge.yaml.nu')
  ]

  # Windows-only setup.
  let windows = [
    ($scripts_dir | path join 'windows-terminal' 'patch-settings.json.nu')
    ($scripts_dir | path join 'windows-terminal-preview' 'patch-settings.json.nu')
    ($scripts_dir | path join 'disable-ctrl-space.nu')
    ($scripts_dir | path join 'set-cc-cxx.nu')
    ($scripts_dir | path join 'set-editor-visual.nu')
    ($scripts_dir | path join 'set-yazi-file-one.nu')
    ($nu.home-dir | path join '.local' 'bin' 'set-cjk-font-fallback.nu')
  ]

  for script in $shared {
    run-script $script
  }

  if $nu.os-info.name == 'windows' {
    for script in $windows {
      run-script $script
    }
    print -e '⚠️ Please install Rime Nightly Build from GitHub Release: https://github.com/rime/weasel/releases/tag/latest. My configuration requires librime v1.14.0+, and the latest stable version still uses librime v1.13.1.'
  }
}
'''
