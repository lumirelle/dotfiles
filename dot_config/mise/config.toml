[settings]
experimental = true
lockfile = true

# Chezmoi is not suitable for /etc/ configuration management, so we use mise dotfiles for that purpose.
[dotfiles]
"/etc/sysctl.d/50-unprivileged-ports.conf/unprivileged-ports" = { line = "net.ipv4.ip_unprivileged_port_start = 80" }

# System Appearance
[tools."github:Tatsu-syo/noMeiryoUI"]
os = "windows"
version = "3.4.2"
version_prefix = "TAG-"
asset_pattern = "noMeiryoUI*.zip"

# Development Environment
# -- CLI / TUI Tools
[tools.yazi]
version = "latest"

[tools.fd]
version = "latest"

[tools.ripgrep]
version = "latest"

[tools.lazygit]
version = "latest"

[tools.hyperfine]
version = "latest"
