#:schema https://mise.jdx.dev/schema/mise.json

[settings]
experimental = true
lockfile = true

[dotfiles]
"/etc/sysctl.d/50-unprivileged-ports.conf/unprivileged-ports" = { line = "net.ipv4.ip_unprivileged_port_start = 80", variants = [{ os = "linux" }] }

[tools]
# Operator System Tools
fastfetch = "latest"
bottom = "latest"
gdu = "latest"
"github:Tatsu-syo/noMeiryoUI" = { os = "windows", version = "latest", version_prefix = "TAG-", asset_pattern = "noMeiryoUI*.zip" }

# Environment Tools
starship = "latest"
node = { version = "latest", postinstall = "npm install -g degit" }
bun = "latest"
java = "latest"
python = "3.13"
fnox = "latest"
age = "latest"

# CLI Tools
jj = "latest"
lazygit = "latest"
fd = "latest"
fzf = "latest"
ripgrep = "latest"
zoxide = "latest"
yazi = "latest"
hyperfine = "latest"
"github:vercel-labs/agent-browser" = "latest"
