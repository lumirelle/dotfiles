[tools]
# Environments
node = "latest"
nub = "latest"
rust = "stable-gnu"
go = "latest"
# Quality
hk = "latest"
stylua = "latest"
pkl = "latest"
"cargo:https://github.com/nushell/nufmt" = { version = "branch:main", install_env = { RUSTFLAGS = "-Clinker=clang" } }
shfmt = "latest"
"go:github.com/gohugoio/gotmplfmt" = "latest"

[deps.nub]
description = 'Automatically install Node.js dependencies via nub.'
sources = [
  'package.json',
  'nub.lock'
]
outputs = [ 'node_modules/' ]
run = 'nub install'
auto = true

[env]
_.path = [
  "{{config_root}}/node_modules/.bin",
  # `mise install` with `rustc` can fail to find `clang` if the path is not set explicitly.
  "~/.local/share/mise/installs/clang/22.1.8/.mise-bins/",
]

[tasks.check]
description = 'Run all checks.'
usage = '''
flag "-s --staged" help="Run on staged files only without stashing unstaged changes"
'''
run = '''
hk check {{ "--staged" if usage.staged else "--all" }}
'''

[tasks.fix]
description = 'Fix all check issues.'
usage = '''
flag "-s --staged" help="Run on staged files only without stashing unstaged changes"
'''
run = '''
hk fix {{ "--staged" if usage.staged else "--all" }}
'''
