[env]
_.path = [
  "{{config_root}}/node_modules/.bin",
  # `mise install` with `rustc` can fail to find `clang` if the path is not set explicitly.
  "~/.local/share/mise/installs/clang/22.1.8/.mise-bins/"
]

[tools]
# Environments
bun = "latest"
node = "24"
aube = "latest"
rust = "stable-gnu"
go = "latest"
# Linters & Formatters
hk = "latest"
stylua = "latest"
pkl = "latest"
"cargo:https://github.com/nushell/nufmt" = { version = "branch:main", install_env = { RUSTFLAGS = "-Clinker=clang" } }
shfmt = "latest"
"go:github.com/gohugoio/gotmplfmt" = "latest"

[deps.bun-aube]
description = "Automatically install dependencies via aube & bun's lockfile."
sources = [
  "package.json",
  "bun.lock"
]
outputs = [ "node_modules/" ]
# Because aube's output lockfile has bugs,
# we use `bun install --lockfile-only` to generate a lockfile
run = "bun install --lockfile-only && aube install"
auto = true

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"
