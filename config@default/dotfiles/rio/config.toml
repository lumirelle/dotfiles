# 1. Disguise as Kitty, deceive Snacks.nvim.
# Rio currently supports Kitty Graphic Protocol, but does not being added to the terminal whitelist of Snacks.nvim.
# 2. Set TERM to fit the prerequisite of TUIOS.
env-vars = ["TERM=xterm-256color", "SNACKS_KITTY=true", "WSLENV=TERM_PROGRAM:TERM_PROGRAM_VERSION:COLORTERM:TERM:SNACKS_KITTY"]

[editor]
program = "nvim"

[cursor]
blinking = true

[effect]
trail-cursor = true

[fonts]
family = "GeistMono Nerd Font"
size = 16

[shell]
program = "nu"
args = ["--login"]

[window]
width = 1200
height = 800
blur = true
