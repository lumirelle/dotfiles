# 1. Set TERM to fit the prerequisite of TUIOS.
env-vars = ["TERM=xterm-256color"]

[editor]
program = "nvim"

[cursor]
blinking = true

[effect]
trail-cursor = true

[fonts]
family = "Aporetic Serif Mono"
size = 16
hinting = false

[shell]
program = "nu"
args = ["--login"]

[window]
width = 1200
height = 800
blur = true
